[project]
name = "rag-mtg"
version = "0.1.0"
description = "AI chatbot that knows the rules of Magic the Gathering."
authors = [
    {name = "Poppo9",email = "pitro97@live.it"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "langchain (>=1.0.2,<2.0.0)",
    "openai (>=2.6.1,<3.0.0)",
    "pinecone (>=7.3.0,<8.0.0)",
    "boto3 (>=1.40.58,<2.0.0)",
    "pypdf (>=6.1.3,<7.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "streamlit (>=1.50.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
